name: Docker

# vX.Y.Z etiketi push edildiğinde (veya elle, var olan bir sürüm için)
# PyPI'deki paketten imaj derler ve ghcr.io/erelbi/sangfor-scp'ye gönderir:
#   :X.Y.Z, :X.Y ve :latest  (linux/amd64 + linux/arm64)
# PyPI yüklemesi etiketten önce yapılır; paket henüz görünmüyorsa iş bekler.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "PyPI'deki sürüm (ör. 0.4.4)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Version
        run: |
          V="${{ inputs.version || github.ref_name }}"
          V="${V#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "MINOR=${V%.*}" >> "$GITHUB_ENV"

      - name: Wait for PyPI
        run: |
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "https://pypi.org/pypi/sangfor-scp/$VERSION/json" && exit 0
            echo "PyPI'de $VERSION henüz yok, bekleniyor..."; sleep 20
          done
          echo "::error::sangfor-scp $VERSION PyPI'de bulunamadı"; exit 1

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: |
            ghcr.io/erelbi/sangfor-scp:${{ env.VERSION }}
            ghcr.io/erelbi/sangfor-scp:${{ env.MINOR }}
            ghcr.io/erelbi/sangfor-scp:latest

      - name: Smoke test
        run: |
          docker run --rm ghcr.io/erelbi/sangfor-scp:${VERSION} --help | head -1
          docker run --rm --entrypoint python ghcr.io/erelbi/sangfor-scp:${VERSION} \
            -c "import sangfor_scp, Crypto; assert sangfor_scp.__version__ == '${VERSION}'"
